name: Bug Report
description: Report a bug, scoring calculation discrepancy, or state machine error
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Provide a clear and concise description of the bug.
      placeholder: Describe the observed vs expected behavior...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Exact match actions or delivery sequence leading to the issue.
      placeholder: |
        1. Start match Team A vs Team B (20 overs)
        2. Deliver 1 run, then Wide + 2 runs
        3. Observe discrepancy in bowler stats
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application Version
      description: Version pill displayed in footer (e.g. v2026.09.001)
      placeholder: "v2026.09.001"
    validations:
      required: true
  - type: textarea
    id: diagnostic-packet
    attributes:
      label: Diagnostic Packet / State URL
      description: Copy from the in-app Bug Report modal or share URL (?s=...)
      placeholder: "https://varun.khaneja.org/cricket-scorecard/?s=..."
    validations:
      required: false

<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Scorecard PWA</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
</head>
<body>
    <div id="app-container" class="container-md py-3 d-flex flex-column min-vh-100">
        <header class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h1 class="h3 mb-0 text-primary">Cricket Scorecard</h1>
            <div class="btn-group" role="group">
                <button id="screenshot-mode-btn" class="btn btn-outline-primary btn-sm">Screenshot</button>
                <button id="reset-match-btn" class="btn btn-outline-danger btn-sm">Reset</button>
                <button id="share-match-btn" class="btn btn-outline-success btn-sm">Share</button>
                <div class="btn-group" role="group">
                    <button id="theme-dropdown" class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                        Theme
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="theme-dropdown">
                        <li><button class="dropdown-item theme-btn" data-theme="light">Light</button></li>
                        <li><button class="dropdown-item theme-btn" data-theme="dark">Dark</button></li>
                        <li><button class="dropdown-item theme-btn" data-theme="green">Cricket Green</button></li>
                    </ul>
                </div>
            </div>
        </header>

        <main class="flex-grow-1">
            <!-- Settings Section -->
            <section id="settings-section" class="card mb-3">
                <div class="card-body">
                    <h2 class="card-title h4 mb-3 text-primary">Match Settings</h2>
                    <div class="row g-3">
                        <div class="col-sm-6 col-md-4">
                            <label for="overs-per-innings" class="form-label">Overs per Innings:</label>
                            <input type="number" id="overs-per-innings" class="form-control" value="8" min="1">
                        </div>
                        <div class="col-sm-6 col-md-4">
                            <label for="max-overs-per-bowler" class="form-label">Max Overs per Bowler:</label>
                            <input type="number" id="max-overs-per-bowler" class="form-control" value="2" min="1">
                        </div>
                        <div class="col-sm-6 col-md-4">
                            <label for="wide-penalty" class="form-label">Wide Penalty (Runs):</label>
                            <input type="number" id="wide-penalty" class="form-control" value="1" min="0">
                        </div>
                        <div class="col-sm-6 col-md-4">
                            <label for="no-ball-penalty" class="form-label">No Ball Penalty (Runs):</label>
                            <input type="number" id="no-ball-penalty" class="form-control" value="1" min="0">
                        </div>
                        <div class="col-sm-6 col-md-4 d-flex flex-column justify-content-end">
                            <div class="form-check mb-2">
                                <input type="checkbox" id="allow-single-batsman" class="form-check-input" checked>
                                <label for="allow-single-batsman" class="form-check-label">Allow single batsman</label>
                            </div>
                            <div class="form-check mb-2">
                                <input type="checkbox" id="enable-legbyes" class="form-check-input">
                                <label for="enable-legbyes" class="form-check-label">Enable Leg Byes</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="team1-players" class="form-label">Team 1 Players (comma separated):</label>
                            <textarea id="team1-players" class="form-control" rows="3" placeholder="Player 1, Player 2..."></textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="team2-players" class="form-label">Team 2 Players (comma separated):</label>
                            <textarea id="team2-players" class="form-control" rows="3" placeholder="Player 1, Player 2..."></textarea>
                        </div>
                        <div class="col-12">
                            <button id="start-match-btn" class="btn btn-primary w-100">Start Match</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Flip Container for Scoreboard and Summary -->
            <div class="flip-container hidden">
                <div class="flipper" id="app-flipper">
                    <!-- Front Face: Scoreboard -->
                    <div class="front-face">
                        <section id="scoreboard-section" class="card mb-3">
                            <div class="card-body">
                                <div class="scoreboard-header text-center mb-3">
                                    <h2 id="match-status" class="h5 text-muted">First Innings</h2>
                                    <div id="score-display" class="display-1 fw-bold text-primary">0 - 0</div>
                                    <div id="overs-display" class="fs-4 text-secondary">Overs: 0.0 / 8</div>
                                </div>

                                <div class="row g-2 mb-3">
                                    <div class="col-6">
                                        <div class="batsman p-2 border rounded d-flex justify-content-between align-items-center">
                                            <select id="batsman1-select" class="form-select form-select-sm w-auto" aria-label="Batsman 1"></select>
                                            <span id="batsman1-stats" class="badge bg-secondary">0 (0)</span>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="batsman p-2 border rounded d-flex justify-content-between align-items-center">
                                            <select id="batsman2-select" class="form-select form-select-sm w-auto" aria-label="Batsman 2"></select>
                                            <span id="batsman2-stats" class="badge bg-secondary">0 (0)</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="bowler-display p-2 border rounded d-flex justify-content-between align-items-center mb-3">
                                    <div class="d-flex align-items-center">
                                        <label for="bowler-select" class="form-label mb-0 me-2">Bowler:</label>
                                        <select id="bowler-select" class="form-select form-select-sm w-auto" aria-label="Bowler"></select>
                                    </div>
                                    <span id="bowler-stats" class="badge bg-secondary">0/0 (0.0)</span>
                                </div>

                                <!-- Over Log -->
                                <div class="over-log-container p-2 border rounded mb-3 d-flex align-items-center gap-2">
                                    <span class="fw-bold">This Over:</span>
                                    <div id="over-log" class="d-flex gap-1 flex-wrap"></div>
                                </div>

                                <div class="extras-display p-2 border rounded mb-3 text-center">
                                    Extras: <span id="extras-total" class="fw-bold">0</span> (W: <span id="wides-display">0</span>, NB: <span id="noballs-display">0</span>, B: <span id="byes-display">0</span>, LB: <span id="legbyes-display">0</span>)
                                </div>

                                <!-- Controls -->
                                <div id="controls-section">
                                    <div class="runs-buttons row g-2 mb-2">
                                        <div class="col-4"><button class="run-btn btn btn-outline-secondary w-100 fs-4" data-runs="0">0</button></div>
                                        <div class="col-4"><button class="run-btn btn btn-outline-secondary w-100 fs-4" data-runs="1">1</button></div>
                                        <div class="col-4"><button class="run-btn btn btn-outline-secondary w-100 fs-4" data-runs="2">2</button></div>
                                        <div class="col-4"><button class="run-btn btn btn-outline-secondary w-100 fs-4" data-runs="3">3</button></div>
                                        <div class="col-4"><button class="run-btn btn btn-outline-secondary w-100 fs-4" data-runs="4">4</button></div>
                                        <div class="col-4"><button class="run-btn btn btn-outline-secondary w-100 fs-4" data-runs="6">6</button></div>
                                    </div>
                                    <div class="extra-buttons row g-2 mb-2">
                                        <div class="col-4"><button id="wide-btn" class="btn btn-warning w-100">Wide</button></div>
                                        <div class="col-4"><button id="noball-btn" class="btn btn-warning w-100">No Ball</button></div>
                                        <div class="col-4"><button id="wicket-btn" class="btn btn-danger w-100">Wicket</button></div>
                                    </div>
                                    <div class="other-buttons row g-2">
                                        <div class="col-4"><button id="bye-btn" class="btn btn-info w-100">Bye</button></div>
                                        <div class="col-4"><button id="legbye-btn" class="btn btn-info w-100">Leg Bye</button></div>
                                        <div class="col-4"><button id="undo-btn" class="btn btn-secondary w-100">Undo</button></div>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>

                    <!-- Back Face: Summary -->
                    <div class="back-face">
                        <section id="summary-section" class="card mb-3">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                                    <h2 class="card-title h4 mb-0 text-primary">Match Summary</h2>
                                    <button id="exit-screenshot-mode-btn" class="btn btn-outline-secondary btn-sm">Exit Screenshot Mode</button>
                                </div>
                                <div id="innings-summaries"></div>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </main>

        <footer class="text-center text-muted mt-auto py-2 border-top">
            <small>Version: 1.2.0 | Deployed: 2026-05-13 06:53</small>
        </footer>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>

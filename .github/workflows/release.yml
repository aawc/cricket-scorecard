name: Create GitHub Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v2026.09.001)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Test Suites
        run: npm test

      - name: Build Production Assets
        run: npm run build

      - name: Resolve Release Tag & Extract Notes
        id: release_meta
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          REF_TAG=""
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            REF_TAG="${{ github.ref_name }}"
          fi

          TARGET_TAG="$INPUT_TAG"
          if [ -z "$TARGET_TAG" ] && [ -n "$REF_TAG" ]; then
            TARGET_TAG="$REF_TAG"
          fi
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG=$(node scripts/extract-release-notes.js --get-tag)
          fi

          echo "Target release tag: $TARGET_TAG"
          node scripts/extract-release-notes.js --tag "$TARGET_TAG" --output RELEASE_NOTES.md
          echo "tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "notes_path=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Package Release Distribution
        run: |
          TAG_NAME="${{ steps.release_meta.outputs.tag }}"
          cd dist && zip -r "../cricket-scorecard-dist-${TAG_NAME}.zip" . && cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.release_meta.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            cricket-scorecard-dist-${{ steps.release_meta.outputs.tag }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true

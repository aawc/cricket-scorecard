name: Deploy to GitHub Pages

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: 'Git ref or commit SHA to checkout and deploy to GitHub Pages'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: 'Optional Git ref or commit SHA to checkout and deploy'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Mirror to /v2/ subpath
        run: |
          mkdir -p dist/v2
          for item in dist/*; do
            if [ "$item" != "dist/v2" ]; then
              cp -a "$item" dist/v2/
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
